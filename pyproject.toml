[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "graphlab"
version = "0.1.0"
description = "Graph algorithms on a city: routing, centrality, state-space search"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "matplotlib>=3.8"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "networkx>=3.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
src = ["src"]

# Pin the rule set explicitly. With no `select`, ruff lints against whatever its
# current defaults are, so a new release turns on new rules and CI fails on code
# that has not changed.
[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "C4"]
